# =============================================================================
# Survey S1 - questionnaire DRAFT 3 (Revision 9 Section 65; owner decisions P1-D5,
# "PHASE 1 FINAL CLOSURE" survey items 1-8 and "P1 FINAL HARDENING" SURVEY-01..07)
# STATUS: DRAFT - not released. Rows with approval_status PENDING_OWNER_APPROVAL or
# experimental_status EXPERIMENT_REVIEW_REQUIRED are not approved.
#
# Every value carries:
#   source               where the number / wording comes from
#   derivation           how it was computed (empty when stated directly)
#   experimental_status  SOURCED_R9 | DERIVED_LOCKED_FORMULA | DERIVED_SOURCED_ETA |
#                        HYPOTHETICAL_SCENARIO | DESIGN_PARAMETER | EXPERIMENT_REVIEW_REQUIRED
#   approval_status      OWNER_DECIDED (<decision>) | PENDING_OWNER_APPROVAL | NOT_ACTIVE_PROPOSAL
# Research parameters live ONLY here - never in pricing_configs, OSRM or the Baseline:
# the 6 km times are survey-scenario values, not production routing parameters.
# Scenario table: python -I scripts/survey/scenario_table.py
# =============================================================================
survey_id: s1
draft_version: 4
language: vi
estimated_minutes: "4-5"            # R9:65.2

respondent:
  id: uuid4_generated_server_side
  collected_pii: none               # R9:59.2 - no name, email, student id, phone, IP

# Evidence for the 6 km ETA (survey item 1): app.modules.ml_models.survey_derive on
# sa-cand-7da7fbe2e01b, 150 seeded urban place nodes, OSRM v5.27.1 medians:
#   car       6 km: 8.80 min (1018 pairs)   14 km: 18.32 min (1208 pairs)
#   motorbike 6 km: 9.57 min (1073 pairs)   14 km: 20.63 min (1213 pairs)
# R9 Section 10.4 at 14 km: car 40 min, motorbike 35 min (peak-hour example).
eta_evidence: docs/implementation/survey/evidence/s1_6km_eta_osrm.json

part_1a:                            # R9:65.2 - urban multimodal choice, 6-8 tasks
  tasks_per_respondent: 8           # full factorial of the three context factors
  context_factors:
    distance_km: {levels: [6, 14], source: "R9:65.2", derivation: "", experimental_status: SOURCED_R9,
                  approval_status: "OWNER_DECIDED (P1-D5)"}
    weather: {levels: [Nắng ráo, Mưa rào], source: "R9:65.2", derivation: "", experimental_status: SOURCED_R9,
              approval_status: "OWNER_DECIDED (P1-D5)"}
    urgency: {levels: [Đi học/làm đúng giờ, Thong thả], source: "R9:65.2", derivation: "", experimental_status: SOURCED_R9,
              approval_status: "OWNER_DECIDED (P1-D5)"}
  alternatives:
    BIKE_URBAN: {label: Xe máy}
    CAR_URBAN_POOL: {label: Taxi ghép}
    CAR_URBAN_PRIVATE: {label: Taxi bao xe}
  levels_by_distance:
    "14":
      BIKE_URBAN:
        price_vnd: {value: 81000, source: "R9:10.4", derivation: "", experimental_status: SOURCED_R9,
                    approval_status: "OWNER_DECIDED (P1-D5)"}
        travel_min: {value: 35, source: "R9:10.4", derivation: "", experimental_status: SOURCED_R9,
                     approval_status: "OWNER_DECIDED (P1-D5)"}
      CAR_URBAN_PRIVATE:
        price_vnd: {value: 194000, source: "R9:10.4 / 16.1", derivation: "", experimental_status: SOURCED_R9,
                    approval_status: "OWNER_DECIDED (P1-D5)"}
        travel_min: {value: 40, source: "R9:10.4 / 16.1", derivation: "", experimental_status: SOURCED_R9,
                     approval_status: "OWNER_DECIDED (P1-D5)"}
      CAR_URBAN_POOL:
        expected_price_vnd: {value: 145000, source: "R9:20.2 Fare_matched_est",
                             derivation: "floor(0.75 x 194000) (d_matched_typical 0.25); 143000 is only R9:16.1 matched scenario A",
                             experimental_status: SOURCED_R9, approval_status: "OWNER_DECIDED (survey item 2)"}
        quote_cap_vnd: {value: 155000, source: "R9:18.3 (Quote_A = 155.000 đ) / R9:5 card shows Quote_i",
                        derivation: "floor(194000 x (1 - d_min 0.20) / 1000) x 1000", experimental_status: SOURCED_R9,
                        approval_status: "OWNER_DECIDED (SURVEY-01)"}
        max_price_if_unmatched_vnd: {value: 174000, source: "R9:10.4 / 18.4", derivation: "", experimental_status: SOURCED_R9,
                                     approval_status: "OWNER_DECIDED (P1-D5)"}
        max_detour_min: {value: 12, source: "R9:10.4 (+12 phút)", derivation: "= 0.30 x 40 (R9:6 default detour ratio)",
                         experimental_status: SOURCED_R9, approval_status: "OWNER_DECIDED (P1-D5)"}
    "6":
      BIKE_URBAN:
        price_vnd: {value: 41000, source: "Baseline bike_urban (10000 + 4500/km + 250/min, floor 1000)",
                    derivation: "floor((10000 + 4500 x 6 + 250 x 16) / 1000) x 1000", experimental_status: DERIVED_LOCKED_FORMULA,
                    approval_status: "OWNER_DECIDED (survey item 1: locked formula)"}
        travel_min: {value: 16, source: "OSRM motorbike 6 km median 9.57 min; R9:10.4 14 km 35 min; OSRM 14 km median 20.63 min",
                     derivation: "9.57 x 35 / 20.63 = 16.24 -> 16 (OSRM calibrated to the R9 14 km example); raw OSRM alternative 10",
                     experimental_status: DERIVED_SOURCED_ETA,
                     approval_status: "OWNER_DECIDED (SURVEY-02: peak-hour survey assumption, not a routing parameter)"}
      CAR_URBAN_PRIVATE:
        price_vnd: {value: 95000, source: "Baseline car_urban (20000 + 11000/km + 500/min, floor 1000)",
                    derivation: "floor((20000 + 11000 x 6 + 500 x 19) / 1000) x 1000", experimental_status: DERIVED_LOCKED_FORMULA,
                    approval_status: "OWNER_DECIDED (survey item 1: locked formula)"}
        travel_min: {value: 19, source: "OSRM car 6 km median 8.80 min; R9:10.4 14 km 40 min; OSRM 14 km median 18.32 min",
                     derivation: "8.80 x 40 / 18.32 = 19.21 -> 19 (OSRM calibrated to the R9 14 km example); raw OSRM alternative 9",
                     experimental_status: DERIVED_SOURCED_ETA,
                     approval_status: "OWNER_DECIDED (SURVEY-02: peak-hour survey assumption, not a routing parameter)"}
      CAR_URBAN_POOL:
        expected_price_vnd: {value: 71000, source: "R9:20.2 Fare_matched_est; Baseline d_matched_typical 0.25",
                             derivation: "floor(0.75 x 95000)", experimental_status: DERIVED_LOCKED_FORMULA,
                             approval_status: "OWNER_DECIDED (survey item 1: locked formula)"}
        quote_cap_vnd: {value: 76000, source: "R9:18.3 Quote_i; Baseline d_min 0.20",
                        derivation: "floor(95000 x 0.80 / 1000) x 1000", experimental_status: DERIVED_LOCKED_FORMULA,
                        approval_status: "OWNER_DECIDED (SURVEY-01)"}
        max_price_if_unmatched_vnd: {value: 85000, source: "R9:18.4 Unmatched; Baseline d_min 0.20, alpha 0.50",
                                     derivation: "Quote = 0.80 x 95000 = 76000; floor(76000 + 0.5 x (95000 - 76000))",
                                     experimental_status: DERIVED_LOCKED_FORMULA,
                                     approval_status: "OWNER_DECIDED (survey item 1: locked formula)"}
        max_detour_min: {value: 6, source: "R9:6 default max_passenger_detour_ratio 0.30 (same rule gives 12 at 14 km)",
                         derivation: "0.30 x 19.21 = 5.76 -> 6; shown as extra MINUTES to pick up / drop off another passenger, never as a distance limit",
                         experimental_status: DERIVED_LOCKED_FORMULA, approval_status: "OWNER_DECIDED (SURVEY-02)"}
  rotated_attributes:
    match_likelihood: {levels: [Cao, Trung bình, Thấp], source: "R9:65.2; SURVEY-03",
                       derivation: "hypothetical survey levels shown as words only - no percentages, not an AI forecast; block rotation (survey_design.py)",
                       experimental_status: HYPOTHETICAL_SCENARIO, approval_status: "OWNER_DECIDED (SURVEY-03)"}
    walk_m: {levels: [0, 200], source: "R9:65.2",
             derivation: "separate attribute; price NOT adjusted (C9 / R9:23.3 mu acts on allocation weights)",
             experimental_status: SOURCED_R9, approval_status: "OWNER_DECIDED (survey item 4)"}
  # Survey item 3: proposal only - NOT shown to respondents until approved.
  # Feasible pool range under the locked bounds: Fare_matched in [(1 - d_max) P, (1 - d_min) P]
  # = [0.40 P, 0.80 P]; unmatched cap 0.90 P.  14 km: [77600, 155200]; 6 km: [38000, 76000].
  price_variation_proposal:
    levels:
      POOL_D020: {applies_to: "CAR_URBAN_POOL expected price", rule: "d = 0.20 (= d_min, the cap)",
                  example_14km_vnd: 155000, example_6km_vnd: 76000, source: "Baseline car_urban d_min",
                  derivation: "floor(0.80 x P)", experimental_status: EXPERIMENT_REVIEW_REQUIRED,
                  approval_status: "APPROVED_FOR_TEST_PILOT_ONLY (OWNER APPROVAL s.4)"}
      POOL_D025: {applies_to: "CAR_URBAN_POOL expected price", rule: "d = 0.25 (d_matched_typical, current level)",
                  example_14km_vnd: 145000, example_6km_vnd: 71000, source: "Baseline d_matched_typical; R9:20.2",
                  derivation: "floor(0.75 x P)", experimental_status: SOURCED_R9,
                  approval_status: "OWNER_DECIDED (survey item 2)"}
      POOL_D035: {applies_to: "CAR_URBAN_POOL expected price", rule: "d = 0.35 (inside [d_min, d_max]; realism unproven)",
                  example_14km_vnd: 126000, example_6km_vnd: 61000, source: "Baseline d_min / d_max bounds",
                  derivation: "floor(0.65 x P)", experimental_status: EXPERIMENT_REVIEW_REQUIRED,
                  approval_status: "APPROVED_FOR_TEST_PILOT_ONLY (OWNER APPROVAL s.4)"}
      PRIVATE_BIKE_PM10: {applies_to: "BIKE_URBAN and CAR_URBAN_PRIVATE price", rule: "x0.90 / x1.10 (market calibration)",
                          example_14km_vnd: "private 174600 / 213400; bike 72900 / 89100",
                          example_6km_vnd: "private 85500 / 104500; bike 36900 / 45100",
                          source: "R9 preamble: tariffs may be calibrated to market prices - no level given",
                          derivation: "not derivable from the locked formulas", experimental_status: EXPERIMENT_REVIEW_REQUIRED,
                          approval_status: "APPROVED_FOR_TEST_PILOT_ONLY (OWNER APPROVAL s.4)"}

      TIME_MODE_PM20: {applies_to: "travel_min of car (private, pool detour) and motorbike, varied independently per mode",
                       rule: "x0.80 / x1.00 / x1.20 per mode, rotated independently of distance (design D)",
                       example_14km_vnd: "times: car 32 / 40 / 48 min; motorbike 28 / 35 / 42 min",
                       example_6km_vnd: "times: car 15 / 19 / 23 min; motorbike 13 / 16 / 19 min",
                       source: "SURVEY-06 identifiability check (scripts/survey/identifiability_check.py)",
                       derivation: "with POOL_D0xx + PRIVATE_BIKE_PM10: rank 9/9, max VIF 5.3; current design: rank 7/9 (not identified)",
                       experimental_status: EXPERIMENT_REVIEW_REQUIRED, approval_status: "APPROVED_FOR_TEST_PILOT_ONLY (OWNER APPROVAL s.4)"}

  # SURVEY-06 design D, implemented but SWITCHED OFF until the owner approves it.
  # Rotation: level index = (a * i + b * (block // block_div) + c) mod 3, i = context index.
  # Identifiability of the generated designs: scripts/survey/identifiability_check.py.
  variation_design:
    # Owner OWNER APPROVAL s.4: approved for the TEST pilot only - prices are HYPOTHETICAL
    # experiment values, never a commercial price version; research collection stays closed.
    active: false
    design: D
    approval_status: "APPROVED_FOR_TEST_PILOT_ONLY (OWNER APPROVAL s.4) - not for research collection"
    experimental_status: EXPERIMENT_REVIEW_REQUIRED
    baseline_bounds: {d_min: 0.20, d_max: 0.60, alpha: 0.50}   # Baseline car_urban (locked)
    factors:
      pool_discount_d:    {levels: [0.20, 0.25, 0.35], a: 1, b: 1, c: 0}
      private_price_mult: {levels: [0.90, 1.00, 1.10], a: 1, b: 2, c: 1}
      bike_price_mult:    {levels: [0.90, 1.00, 1.10], a: 2, b: 1, c: 2}
      car_time_mult:      {levels: [0.80, 1.00, 1.20], a: 1, b: 1, c: 0, block_div: 2}
      bike_time_mult:     {levels: [0.80, 1.00, 1.20], a: 2, b: 1, c: 1, block_div: 3}

  # Statistical adjustment PROPOSED after the TEST pilot (not active, owner decision pending):
  # with D the time effect is not estimable at N = 150 (expected |t| 1.1); D2 below gives
  # |t| 2.7 for time with the lean primary specification. Overrides of variation_design.factors.
  variation_design_proposals:
    D2:
      approval_status: PROPOSED
      experimental_status: EXPERIMENT_REVIEW_REQUIRED
      factor_overrides:
        car_time_mult:  {levels: [0.70, 1.00, 1.30]}
        bike_time_mult: {levels: [0.70, 1.00, 1.30], a: 1, b: 1, c: 1, block_div: 2}
        detour_mult:    {levels: [0.50, 1.00, 1.50], a: 2, b: 2, c: 1}
      primary_mnl_spec: "ASC_bike, ASC_pool, price, time, likelihood (MEDIUM, LOW), walk_200, rain x ASC_bike; detour and unmatched gap reported as exploratory"

part_1b:                            # R9:65.2 - intercity, 2 tasks
  tasks_per_respondent: 2
  alternatives:
    CAR_INTERCITY_POOL:
      label: Taxi ghép liên tỉnh (đặt trước 3–5 ngày)
      seat_price_vnd: {levels: [180000, 220000], source: "R9:28.2 / 65.2", derivation: "", experimental_status: SOURCED_R9,
                       approval_status: "OWNER_DECIDED (P1-D5)"}
      # Survey item 5: hypothetical scenario values - not a system / AI prediction.
      fill_likelihood:
        levels:
          - {code: LOW, text: "Thấp (tình huống giả định)"}
          - {code: MEDIUM, text: "Trung bình (tình huống giả định)"}
          - {code: HIGH, text: "Cao (tình huống giả định)"}
        source: "owner OWNER APPROVAL s.5: three hypothetical levels, not tied to the seat price"
        derivation: "words only - no seat counts, no percentages, not a system forecast"
        experimental_status: HYPOTHETICAL_SCENARIO
        approval_status: "OWNER_DECIDED (OWNER APPROVAL s.5)"
      lead_days: {value: "3–5", source: "R9:65.2", derivation: "", experimental_status: SOURCED_R9,
                  approval_status: "OWNER_DECIDED (P1-D5)"}
    CAR_INTERCITY_PRIVATE:
      label: Taxi bao xe liên tỉnh (đi ngay, chủ động)
      price_vnd: {value: 637000, source: "R9:25.2 / 65.2 (Hà Đông → TP Hưng Yên, 65 km)",
                  derivation: "floor(150000 + 7500 x 65); OSRM gives 58.06 km (A8 context, not used)",
                  experimental_status: SOURCED_R9, approval_status: "OWNER_DECIDED (P1-D5)"}
    OTHER: {label: Phương tiện khác / Không đi}
  pairing: {rule: "task j gets fill level (j + block) mod 3 -> over the 6 blocks every seat price meets every level twice (orthogonal, not hard-wired)",
            source: "design (survey_design.py)", derivation: "", experimental_status: DESIGN_PARAMETER,
            approval_status: "OWNER_DECIDED (OWNER APPROVAL s.5: level not tied to seat price)"}

part_2_h4:                          # R9:65.2 / 16.1 - fairness, 3 Likert ratings + 1 choice
  scenario:
    trip_total_vnd: {value: 248500, source: "R9:16.1 PlanFare", derivation: "", experimental_status: SOURCED_R9,
                     approval_status: "OWNER_DECIDED (P1-D5)"}
    passenger_a: {distance_km: 14, detour_pct: 25, source: "R9:16.1", derivation: "", experimental_status: SOURCED_R9,
                  approval_status: "OWNER_DECIDED (P1-D5)"}
    passenger_b: {distance_km: 9, detour_pct: 0, source: "R9:16.1", derivation: "", experimental_status: SOURCED_R9,
                  approval_status: "OWNER_DECIDED (P1-D5)"}
  methods:                          # shown with neutral labels X/Y/Z in randomised order
    A_proportional: {a_discount_pct: 24.0, b_discount_pct: 24.0, source: "R9:65.2 / 16.1", derivation: "",
                     experimental_status: SOURCED_R9, approval_status: "OWNER_DECIDED (P1-D5)"}
    B_shapley_equal_split: {a_discount_pct: 20.2, b_discount_pct: 29.5, source: "R9:65.2 / 16.1", derivation: "",
                            experimental_status: SOURCED_R9, approval_status: "OWNER_DECIDED (P1-D5)"}
    C_inconvenience_weighted: {a_discount_pct: 26.1, b_discount_pct: 20.9, source: "R9:65.2 / 16.1", derivation: "",
                               experimental_status: SOURCED_R9, approval_status: "OWNER_DECIDED (P1-D5)"}
  likert_scale: {min: 1, max: 5, source: "R9:65.2"}

part_3_demographics:                # R9:65.2 - minimal, anonymous; survey item 6: non-overlapping bins
  group:
    question: "Bạn hiện là"
    options: [{code: STUDENT, text: Sinh viên}, {code: WORKER, text: Người đã đi làm}]
    source: "R9:65.1"
    derivation: "asked first: the group quota is applied at session start"
    experimental_status: SOURCED_R9
    approval_status: "OWNER_DECIDED (survey item 8)"
  # SURVEY-04: optional - a respondent may skip D2-D4 (stored as null).
  ride_hailing_trips_per_week:
    question: "Mỗi tuần bạn sử dụng dịch vụ đặt xe bao nhiêu lần?"
    required: false
    options: [{code: "0", text: "0 lần"}, {code: "1", text: "1 lần"}, {code: "2-3", text: "2–3 lần"},
              {code: "4-6", text: "4–6 lần"}, {code: "7+", text: "Từ 7 lần trở lên"}]
    source: "R9:65.2 (question); bins: owner SURVEY-04"
    derivation: "integer counts, disjoint and exhaustive"
    experimental_status: DESIGN_PARAMETER
    approval_status: "OWNER_DECIDED (SURVEY-04)"
  usual_trip_distance:
    question: "Quãng đường di chuyển phổ biến của bạn?"
    required: false
    options: [{code: LT3, text: "Dưới 3 km"}, {code: 3-LT6, text: "Từ 3 đến dưới 6 km"}, {code: 6-LT10, text: "Từ 6 đến dưới 10 km"},
              {code: 10-LT20, text: "Từ 10 đến dưới 20 km"}, {code: "20+", text: "Từ 20 km trở lên"}]
    source: "R9:65.2 (question); bins: owner SURVEY-04"
    derivation: "half-open intervals [a, b): no overlap"
    experimental_status: DESIGN_PARAMETER
    approval_status: "OWNER_DECIDED (SURVEY-04)"
  intercity_trips_per_month:
    question: "Mỗi tháng bạn đi liên tỉnh bao nhiêu chuyến?"
    required: false
    options: [{code: "0", text: "0 chuyến"}, {code: "1", text: "1 chuyến"}, {code: "2-3", text: "2–3 chuyến"},
              {code: "4+", text: "Từ 4 chuyến trở lên"}]
    source: "R9:65.2 (question); bins: owner SURVEY-04"
    derivation: "integer counts, disjoint and exhaustive"
    experimental_status: DESIGN_PARAMETER
    approval_status: "OWNER_DECIDED (SURVEY-04)"

quality_rules:                      # survey item 7: flags only, published before collection
  QC1: {rule: "all 10 choice tasks, 3 ratings, preferred method and D1 answered (D2-D4 optional)", action: REQUIRED_BY_API,
        source: "SURVEY_S1_DESIGN_REVIEW §7", derivation: "", experimental_status: DESIGN_PARAMETER,
        approval_status: "OWNER_DECIDED (P1-D5)"}
  QC2: {rule: "completion time < 120 s (half of the 4-minute lower bound of R9:65.2)", action: FLAG_ONLY,
        flag: FAST_RESPONSE_REVIEW, flag_below_seconds: 120, source: "R9:65.2 (~4-5 min); owner SURVEY-05",
        derivation: "0.5 x 240 s; duration from an HMAC-signed start token; never an automatic exclusion",
        experimental_status: DESIGN_PARAMETER, approval_status: "OWNER_DECIDED (SURVEY-05)"}
  QC3: {rule: "same card position in all 8 Part-1A tasks", action: FLAG_ONLY, source: "SURVEY_S1_DESIGN_REVIEW §7",
        derivation: "", experimental_status: DESIGN_PARAMETER, approval_status: "OWNER_DECIDED (survey item 7)"}
  QC4: {rule: "same Likert score for all three H4 methods", action: FLAG_ONLY, source: "SURVEY_S1_DESIGN_REVIEW §7",
        derivation: "", experimental_status: DESIGN_PARAMETER, approval_status: "OWNER_DECIDED (survey item 7)"}
  QC5: {rule: "attention-check task", action: NOT_USED, source: "SURVEY_S1_DESIGN_REVIEW §7; owner SURVEY-05",
        derivation: "would lengthen the survey; no concrete proposal", experimental_status: DESIGN_PARAMETER,
        approval_status: "OWNER_DECIDED (SURVEY-05: not used)"}

# SURVEY-05: data rules fixed BEFORE collection (published with the release).
analysis_rules:
  R1_incomplete: {rule: "sessions without a submission are not exported (no partial answers exist: the API accepts only complete submissions)",
                  action: EXCLUDE_BY_CONSTRUCTION, source: "survey_service.submit / export_table", derivation: "",
                  experimental_status: DESIGN_PARAMETER, approval_status: PENDING_OWNER_APPROVAL}
  R2_duplicate: {rule: "one submission per session (409 ALREADY_SUBMITTED); repeated sessions by one person cannot be linked (anonymous) - limited by rate limits; no identity matching is attempted",
                 action: PREVENTED_AT_COLLECTION, source: "survey_service / survey_guard", derivation: "",
                 experimental_status: DESIGN_PARAMETER, approval_status: PENDING_OWNER_APPROVAL}
  R3_invalid: {rule: "answers outside the shown options, unknown fields or a forged start token are rejected by the API (422) and never stored",
               action: REJECTED_AT_COLLECTION, source: "survey_schemas (extra=forbid)", derivation: "",
               experimental_status: DESIGN_PARAMETER, approval_status: PENDING_OWNER_APPROVAL}
  R4_flags: {rule: "primary analysis keeps every stored response; a sensitivity analysis drops FAST_RESPONSE_REVIEW, QC3 and QC4 flagged responses; both are reported",
             action: REPORT_BOTH, source: "owner SURVEY-05", derivation: "", experimental_status: DESIGN_PARAMETER,
             approval_status: PENDING_OWNER_APPROVAL}
  R5_test_data: {rule: "only dataset RESEARCH from the release server is analysed; TEST rows are never merged",
                 action: SEPARATED, source: "SURVEY_DATASET / SURVEY_S1_RELEASED", derivation: "",
                 experimental_status: DESIGN_PARAMETER, approval_status: "OWNER_DECIDED (SURVEY-07)"}

quotas:                             # R9:65.1; survey item 8
  target_valid_respondents: 150
  nominal_per_group: 75
  group_share: {min: 0.40, max: 0.60}   # cap per group = floor(0.60 x 150) = 90, enforced at session start
  source: "R9:65.1 (100-200, 40-60 %); owner survey item 8 (150, 75/75)"
  derivation: "a full group is closed at session start (409 QUOTA_FULL_FOR_GROUP)"
  experimental_status: DESIGN_PARAMETER
  approval_status: "OWNER_DECIDED (survey item 8)"
