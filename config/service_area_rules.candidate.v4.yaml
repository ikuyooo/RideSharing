total:
  province_scope: all_within_range   # A5
  neighbours:   # Section 1 names -> current provinces (documentation of A1)
    - {name: Hưng Yên, by: province_iso, iso3166_2: VN-66}
    - {name: Bắc Ninh, by: province_iso, iso3166_2: VN-56}
    - {name: Hải Dương, by: contains_node, osm_node: 369487115}
    - {name: Hà Nam, by: contains_node, osm_node: 369487036}
    - {name: Vĩnh Phúc, by: contains_node, osm_node: 369486946}
    - {name: Hòa Bình, by: contains_node, osm_node: 13967896564}
  anchor:
    osm_node: 74132064   # A4 / GEO-03: technical anchor (admin_centre of r1903516)
  unit_admin_level: 6
  # GEO-C tier 1: a unit enters the TOTAL polygon when its NEAREST point lies within
  # the limit in a straight line (geodesic, spheroid). A road distance is never
  # shorter than the straight line, so the polygon never rejects a point the road
  # check would accept; the per-point road check (tier 2) is mandatory.
  tier1_rule: geodesic_lower_bound
  sensitivity_band_km: 30
  sensitivity_points_per_unit: 16
  # GEO-04: TOTAL components probed at PointOnSurface + N seeded points; no road
  # inside / no route from the anchor -> EXCLUDED layer (raw polygon kept).
  component_probe_points: 4

# Tier 2 (per pickup / dropoff point; one OSRM car /table request, elements
# anchor->pickup, anchor->dropoff, pickup->dropoff). max_road_km = Baseline
# max_total_service_radius_km (accept distance_m <= 150000). max_snap_m: owner GEO-D,
# temporary MVP technical threshold - NOT a Baseline parameter; re-evaluate before P2.
# exclude: owner GEO-E - journeys that need a ferry are not supported in the MVP.
serviceability:
  max_snap_m: 300
  exclude: [ferry]

